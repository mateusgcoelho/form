<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Diagnóstico Fratelli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.0"></script>

<style>
  :root {
    color-scheme: light;
    --background: #ffffff;
    --foreground: #111118;
    --muted: #f1f1f4;
    --muted-foreground: #5d5d6a;
    --card: #f6f6f8;
    --border: rgb(17 17 24 / .10);
    --input: rgb(17 17 24 / .045);
    --primary: #d23a1f;
    --primary-foreground: #ffffff;
    --accent: #b02a12;
    --accent-soft: #fde4de;
    --ring: rgb(210 58 31 / .4);
    --negative: #dc2626;
  }
</style>

<style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--background);
    --color-foreground: var(--foreground);
    --color-muted: var(--muted);
    --color-muted-foreground: var(--muted-foreground);
    --color-card: var(--card);
    --color-border: var(--border);
    --color-input: var(--input);
    --color-primary: var(--primary);
    --color-primary-foreground: var(--primary-foreground);
    --color-accent: var(--accent);
    --color-accent-soft: var(--accent-soft);
    --color-ring: var(--ring);
    --color-negative: var(--negative);
    --font-sans: 'Geist', ui-sans-serif, system-ui, sans-serif;
    --font-serif: 'Source Serif 4', ui-serif, Georgia, serif;
    --radius-control: 0.7rem;
    --radius-field: 1rem;
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  }
  @layer base {
    *, ::before, ::after { border-color: var(--border); }
    html { scroll-behavior: smooth; overflow-x: clip; }
    body {
      overflow-x: clip;
      background: var(--background);
      color: var(--foreground);
      font-family: var(--font-sans);
      font-size: 1rem;
      line-height: 1.6;
      letter-spacing: -0.006em;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      -webkit-text-size-adjust: 100%;
      overflow-wrap: anywhere;
    }
    ::selection { background: var(--accent-soft); }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  }
  @utility display {
    font-family: var(--font-serif);
    font-weight: 600;
    letter-spacing: -0.02em;
    font-optical-sizing: auto;
  }
  @utility focus-ring {
    &:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--ring); }
  }
  @utility hero-in {
    animation: hero-in .6s ease-out both;
    animation-delay: calc(var(--i, 0) * 80ms);
  }
  @utility animate-swap-in { animation: swap-in .25s var(--ease-out) both; }
  @utility animate-icon-pop { animation: icon-pop .5s var(--ease-out) both; }
  @keyframes hero-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes swap-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes icon-pop {
    0% { transform: scale(.6) rotate(-12deg); }
    60% { transform: scale(1.25) rotate(6deg); }
    100% { transform: scale(1) rotate(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .hero-in, .animate-swap-in, .animate-icon-pop { animation: none !important; }
  }
</style>
</head>

<body class="min-h-dvh">

<header class="mx-auto flex w-full max-w-3xl items-center justify-between px-4 pt-5 sm:px-6 sm:pt-6">
  <span id="brand" class="text-sm font-semibold tracking-[-0.006em]"></span>
  <span id="timeHint" class="text-[0.8125rem] text-muted-foreground">≈ 4 minutos</span>
</header>

<main class="mx-auto w-full max-w-3xl px-4 pb-36 sm:px-6">

  <section id="hero" class="pt-[clamp(1.75rem,6vh,4.5rem)] pb-6 sm:pb-10">
    <h1 id="heroTitle" class="display hero-in text-balance text-[clamp(2rem,1.2rem+4vw,3.5rem)] leading-[1.04]" style="--i:0"></h1>
    <p id="heroLead" class="hero-in mt-5 max-w-[50ch] text-pretty text-[clamp(1.0625rem,1rem+0.35vw,1.25rem)] leading-[1.55] tracking-[-0.012em] text-muted-foreground" style="--i:1"></p>
  </section>

  <div id="app" class="hero-in scroll-mt-24" style="--i:2">
    <!-- progresso fixo no topo: no celular o usuário rola muito e perde a noção de onde está -->
    <div class="sticky top-0 z-20 -mx-4 bg-background/90 px-4 pb-3 pt-3 backdrop-blur sm:-mx-6 sm:px-6">
      <div class="mb-2 flex items-center justify-between gap-3 text-[0.8125rem] text-muted-foreground">
        <span id="stepLabel" class="min-w-0 truncate font-medium"></span>
        <span id="stepPct" class="shrink-0 tabular-nums"></span>
      </div>
      <div class="h-1.5 overflow-hidden rounded-full bg-muted" role="progressbar" aria-label="Progresso do formulário" id="bar" aria-valuemin="0" aria-valuemax="100">
        <div id="barFill" class="h-full origin-left rounded-full bg-primary transition-[width] duration-500 ease-out motion-reduce:transition-none" style="width:0%"></div>
      </div>
    </div>

    <form id="form" novalidate class="mt-4">
      <div id="stepBody" class="animate-swap-in scroll-mt-24"></div>

    </form>
  </div>

  <section id="done" class="hidden">
    <div>
      <span class="grid size-12 place-items-center rounded-full bg-accent-soft text-accent">
        <svg viewBox="0 0 24 24" class="animate-icon-pop size-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>
      </span>
      <h2 id="doneTitle" class="display mt-5 text-[clamp(1.75rem,1.2rem+2vw,2.5rem)] leading-[1.08] text-balance"></h2>
      <p id="doneText" class="mt-3 max-w-[50ch] text-pretty text-muted-foreground"></p>
    </div>
  </section>
</main>

<!-- Barra de ações fixa na base da tela. Fica direto no body, fora de qualquer elemento
     animado, para que o position:fixed sempre valha em relação à janela. -->
<div id="actions" class="fixed inset-x-0 bottom-0 z-30 border-t bg-background pb-[max(0.75rem,env(safe-area-inset-bottom))] pt-3">
  <div class="mx-auto w-full max-w-3xl px-4 sm:px-6">
    <p id="error" role="alert" class="mb-3 hidden text-sm text-negative"></p>
    <div class="flex items-center justify-between gap-3">
      <button type="button" id="back" class="focus-ring group inline-flex h-12 items-center gap-1.5 rounded-control px-3 text-sm font-medium text-muted-foreground transition duration-150 hover:bg-muted hover:text-foreground">
        <svg viewBox="0 0 24 24" class="size-4 transition-transform duration-200 ease-out group-hover:-translate-x-0.5 motion-reduce:transition-none" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
        Voltar
      </button>
      <button type="submit" form="form" id="next" class="focus-ring group inline-flex h-12 min-w-0 flex-1 items-center justify-center gap-2 rounded-control bg-primary px-[1.375rem] font-semibold text-primary-foreground transition duration-150 hover:opacity-[.88] active:scale-[.98] disabled:opacity-50 sm:flex-none">
        <span id="nextLabel">Continuar</span>
        <svg viewBox="0 0 24 24" class="size-4 shrink-0 transition-transform duration-200 ease-out group-hover:translate-x-0.5 motion-reduce:transition-none" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      </button>
    </div>
  </div>
</div>

<script id="boot" type="application/json">__BOOT__</script>
<script>
const boot = JSON.parse(document.getElementById('boot').textContent);
const { form, token } = boot;
const $ = id => document.getElementById(id);
const body = $('stepBody');

/* ============ helpers ============ */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const arr = v => Array.isArray(v) ? v : (v ? [v] : []);
const flat = fs => fs.flatMap(f => f.type === 'pair' ? flat(f.fields) : [f]);
const isEmpty = v => Array.isArray(v) ? !v.length : !String(v ?? '').trim();
const toggle = (a, v, max) => { a = [...a]; const i = a.indexOf(v); if (i > -1) a.splice(i, 1); else if (!max || a.length < max) a.push(v); return a; };

const CHECK = '<svg viewBox="0 0 24 24" class="size-3.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
const inputCls = 'focus-ring block w-full rounded-field border border-transparent bg-input px-4 text-base transition duration-200 ease-out placeholder:text-muted-foreground/70 focus:border-primary/30 focus:bg-background aria-[invalid=true]:border-negative/50';
const lbl = f => `<label for="${esc(f.name)}" class="mb-2 block text-sm font-medium tracking-[-0.006em]">${esc(f.label)}${f.required ? ' <span class="text-accent" aria-hidden="true">*</span>' : ''}</label>`;
const pill = on => on ? 'border-primary bg-primary text-primary-foreground' : 'border-border bg-background text-muted-foreground hover:border-foreground/25';

/* ============ estado + rascunho local ============ */
const KEY = 'draft:' + token;
const state = {};
let step = 0;
try {
  const d = JSON.parse(localStorage.getItem(KEY) || '{}');
  Object.assign(state, d.answers || {});
  step = Math.min(d.step || 0, form.steps.length - 1);
} catch {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ answers: state, step })); } catch {} };

/* ============ renderização por tipo ============ */
function renderField(f) {
  const v = state[f.name];
  switch (f.type) {
    case 'pair':
      return `<div class="grid grid-cols-1 gap-5 sm:grid-cols-2">${f.fields.map(renderField).join('')}</div>`;

    case 'text':
      return `<div>${lbl(f)}<input id="${esc(f.name)}" name="${esc(f.name)}" type="text" placeholder="${esc(f.placeholder)}" value="${esc(v)}" class="${inputCls} h-12"></div>`;

    case 'area':
      return `<div>${lbl(f)}<textarea id="${esc(f.name)}" name="${esc(f.name)}" rows="3" placeholder="${esc(f.placeholder)}" class="${inputCls} min-h-24 resize-y py-3 leading-[1.5]">${esc(v)}</textarea></div>`;

    case 'select': {
      const o = f.options.map(x => `<option value="${esc(x)}" ${v === x ? 'selected' : ''}>${esc(x)}</option>`).join('');
      return `<div>${lbl(f)}<div class="relative"><select id="${esc(f.name)}" name="${esc(f.name)}" class="${inputCls} h-12 cursor-pointer appearance-none pr-10"><option value="">Selecione</option>${o}</select><svg viewBox="0 0 24 24" class="pointer-events-none absolute right-3.5 top-1/2 size-4 -translate-y-1/2 text-muted-foreground" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></div></div>`;
    }

    case 'chips': {
      const sel = arr(v);
      const c = f.options.map(o => `<button type="button" data-chip="${esc(f.name)}" ${f.single ? 'data-single="1"' : ''} data-value="${esc(o)}" aria-pressed="${sel.includes(o)}" class="focus-ring h-10 rounded-full border px-4 text-sm font-medium transition duration-150 active:scale-95 sm:h-8 sm:px-3 ${pill(sel.includes(o))}">${esc(o)}</button>`).join('');
      return `<div><p class="text-sm font-medium tracking-[-0.006em]">${esc(f.label)}${f.required ? ' <span class="text-accent" aria-hidden="true">*</span>' : ''}</p>${f.hint ? `<p class="mt-0.5 text-[0.8125rem] text-muted-foreground">${esc(f.hint)}</p>` : ''}<div class="mt-3 flex flex-wrap gap-2">${c}</div></div>`;
    }

    case 'scale': {
      let b = '';
      for (let i = f.min; i <= f.max; i++) {
        const on = v === String(i);
        b += `<button type="button" data-scale="${esc(f.name)}" data-value="${i}" aria-pressed="${on}" class="focus-ring h-11 min-w-0 rounded-control border text-sm font-medium tabular-nums transition duration-150 active:scale-95 sm:h-10 ${pill(on)}">${i}</button>`;
      }
      // celular: 6 por linha (alvos de 44px); a partir de sm, tudo numa linha só
      return `<div><p class="text-sm font-medium tracking-[-0.006em]">${esc(f.label)}</p><div class="mt-3 grid grid-cols-6 gap-2 sm:flex sm:gap-1.5 [&>button]:sm:flex-1">${b}</div><div class="mt-2 flex justify-between text-xs text-muted-foreground"><span>${esc(f.low)}</span><span>${esc(f.high)}</span></div></div>`;
    }

    case 'cards': {
      const sel = arr(v);
      const c = f.options.map(o => {
        const on = sel.includes(o.v);
        return `<button type="button" data-card="${esc(f.name)}" ${f.rank ? `data-rank="${esc(f.rank.name)}"` : ''} data-value="${esc(o.v)}" aria-pressed="${on}" class="focus-ring group flex min-w-0 items-start gap-3 rounded-field p-4 text-left transition duration-200 ease-out active:scale-[.99] ${on ? 'bg-accent-soft' : 'bg-card hover:bg-muted'}">
          <span class="mt-0.5 grid size-5 shrink-0 place-items-center rounded-md border transition duration-200 ${on ? 'border-primary bg-primary text-primary-foreground' : 'border-foreground/25 text-transparent'}">${on ? `<span class="animate-icon-pop">${CHECK}</span>` : CHECK}</span>
          <span class="min-w-0"><span class="block text-sm ${on ? 'font-semibold text-accent' : 'font-medium'}">${esc(o.t)}</span><span class="mt-0.5 block text-[0.8125rem] leading-[1.45] text-muted-foreground">${esc(o.d)}</span></span>
        </button>`;
      }).join('');
      let html = `<div><p class="mb-3 text-[0.8125rem] text-muted-foreground">${esc(f.hint)}</p><div class="grid grid-cols-1 gap-2.5 sm:grid-cols-2">${c}</div></div>`;
      if (f.rank && sel.length) {
        const cur = arr(state[f.rank.name]);
        const t = sel.map(id => {
          const o = f.options.find(x => x.v === id); const idx = cur.indexOf(id);
          return `<button type="button" data-top="${esc(f.rank.name)}" data-max="${f.rank.max}" data-value="${esc(id)}" aria-pressed="${idx > -1}" class="focus-ring inline-flex h-10 items-center gap-2 rounded-full border pl-1.5 pr-3.5 text-left text-sm sm:h-9 font-medium transition duration-150 active:scale-95 ${pill(idx > -1)}">
            <span class="grid size-6 place-items-center rounded-full text-xs font-semibold tabular-nums ${idx > -1 ? 'bg-primary-foreground/20' : 'bg-muted'}">${idx > -1 ? idx + 1 : '·'}</span>${esc(o.t)}</button>`;
        }).join('');
        html += `<div class="mt-6 border-t pt-6"><p class="text-sm font-medium tracking-[-0.006em]">${esc(f.rank.label)}</p><p class="mt-0.5 text-[0.8125rem] text-muted-foreground">Toque na ordem de importância (até ${f.rank.max}). Toque de novo para remover.</p><div class="mt-3 flex flex-wrap gap-2">${t}</div></div>`;
      }
      return html;
    }
  }
  return '';
}

const fieldsHtml = () => form.steps[step].fields.map(renderField).join('');

function render() {
  const s = form.steps[step];
  body.innerHTML = `
    <h2 class="display text-[clamp(1.5rem,1.2rem+1.4vw,2.125rem)] leading-[1.1] text-balance">${esc(s.title)}</h2>
    <p class="mt-2 max-w-[56ch] text-pretty text-muted-foreground">${esc(s.sub)}</p>
    <div data-fields class="mt-7 flex flex-col gap-5">${fieldsHtml()}</div>`;
  body.classList.remove('animate-swap-in'); void body.offsetWidth; body.classList.add('animate-swap-in');

  const pct = Math.round((step / form.steps.length) * 100);
  $('stepLabel').textContent = `Etapa ${step + 1} de ${form.steps.length} · ${s.title}`;
  $('stepPct').textContent = pct + '%';
  $('barFill').style.width = Math.max(pct, 4) + '%';
  $('bar').setAttribute('aria-valuenow', pct);
  $('back').style.visibility = step === 0 ? 'hidden' : 'visible';
  $('nextLabel').textContent = step === form.steps.length - 1 ? 'Enviar respostas' : 'Continuar';
  showError('');
}

function showError(msg) { const e = $('error'); e.textContent = msg; e.classList.toggle('hidden', !msg); }

/* ============ eventos ============ */
body.addEventListener('input', e => {
  const t = e.target; if (!t.name) return;
  state[t.name] = t.value; t.removeAttribute('aria-invalid'); showError(''); save();
});
body.addEventListener('change', e => { const t = e.target; if (t.tagName === 'SELECT') { state[t.name] = t.value; t.removeAttribute('aria-invalid'); save(); } });

body.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const v = b.dataset.value;
  if (b.dataset.chip) {
    const n = b.dataset.chip, cur = arr(state[n]);
    state[n] = b.dataset.single ? (cur.includes(v) ? [] : [v]) : toggle(cur, v);
  } else if (b.dataset.card) {
    const n = b.dataset.card; state[n] = toggle(arr(state[n]), v);
    const r = b.dataset.rank; if (r) state[r] = arr(state[r]).filter(x => state[n].includes(x));
  } else if (b.dataset.top) {
    state[b.dataset.top] = toggle(arr(state[b.dataset.top]), v, Number(b.dataset.max));
  } else if (b.dataset.scale) {
    state[b.dataset.scale] = v;
  } else return;
  save(); showError('');
  const y = window.scrollY;
  body.querySelector('[data-fields]').innerHTML = fieldsHtml();
  window.scrollTo(0, y);
});

function validate() {
  for (const f of flat(form.steps[step].fields)) {
    if (f.required && isEmpty(state[f.name])) {
      const el = $(f.name); el?.setAttribute('aria-invalid', 'true'); el?.focus();
      showError(f.type === 'cards' ? 'Marque pelo menos uma opção para continuar.' : 'Preencha os campos marcados com *.');
      return false;
    }
  }
  return true;
}

// o cabeçalho de progresso é fixo, então a etapa nova alinha logo abaixo dele
const scrollToForm = () => $('stepBody').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });

$('form').addEventListener('submit', e => {
  e.preventDefault();
  if (!validate()) return;
  if (step < form.steps.length - 1) { step++; save(); render(); scrollToForm(); }
  else finish();
});
$('back').addEventListener('click', () => { if (step > 0) { step--; save(); render(); scrollToForm(); } });

/* ============ envio ============ */
function showDone(already) {
  $('app').classList.add('hidden'); $('actions').classList.add('hidden'); $('hero').classList.add('hidden'); $('timeHint').classList.add('hidden');
  $('doneTitle').textContent = already ? 'Este link já foi respondido.' : 'Obrigado! Recebemos as suas respostas.';
  $('doneText').textContent = already ? 'Se precisar corrigir algo, fale com quem te enviou o link.' : 'Entraremos em contato em breve com uma proposta sob medida.';
  $('done').classList.remove('hidden'); $('done').classList.add('animate-swap-in');
  window.scrollTo({ top: 0, behavior: 'auto' });
}

async function finish() {
  const btn = $('next'); btn.disabled = true; showError('');
  try {
    const r = await fetch('/api/r/' + encodeURIComponent(token), {
      method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ answers: state })
    });
    if (r.status === 409) { showDone(true); return; }
    if (!r.ok) { const j = await r.json().catch(() => ({})); showError(j.error || 'Não foi possível enviar. Tente de novo.'); return; }
    try { localStorage.removeItem(KEY); } catch {}
    showDone(false);
  } catch {
    showError('Sem conexão. Suas respostas estão salvas, tente de novo.');
  } finally { btn.disabled = false; }
}

/* ============ início ============ */
document.title = 'Diagnóstico ' + form.brand;
$('brand').textContent = form.brand;
$('heroTitle').textContent = form.heroTitle;
$('heroLead').textContent = form.heroLead;
if (boot.submitted) showDone(true); else render();
</script>
</body>
</html>
